            <!---------main ----------->
            <main>
                <h1>Contact Information</h1>
                <address class="contact-info">

                    Lian Khek<br>
                    Email:<a href="mailto:liankhek@gmail.com">liankhek@gmail.com</a><br><br>
                    <a href="mailto:liankhek@gmail.com">Contact me</a>

                </address>

                <p>For any inquiries, you may contact me by filling up the following form</p>

                <form class="contact-form" action="mailto:liankhek@gmail.com" method="POST" enctype="text/plain">

                    <div class="input-wrapper">
                        <label class="standard-label" for="name">Name: *</label>
                        <input type="text" id="name" name="name" placeholder="Full Name" required>
                    </div>
                
                    <div class="input-wrapper">
                        <label class="standard-label" for="contact-email">E-mail: *</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="input-wrapper">
                        <label class="standard-label" for="telephone">Telephone:</label>
                        <input type="tel" id="telephone" name="telephone" pattern="\d{3}-\d{3}-\d{4}" placeholder="###-###-####">
                    </div>
                
                    <div class="input-wrapper">
                        <label class="standard-label" for="message">Message: *</label>
                        <textarea maxlength="240" id="message" name="message" placeholder="Text max-length 240" required></textarea>
                    </div>
                
                    <button class="button primary-button" type="submit">Submit</button>
                </form>

            </main>

        </div>
